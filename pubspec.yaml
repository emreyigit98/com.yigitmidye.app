name: firebase_app
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  fluttertoast: ^9.0.0
  webview_flutter: ^4.13.1
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  cloud_functions: ^6.0.6
  page_transition: ^2.2.1
  go_router: ^17.1.0
  flutter_svg: ^2.2.3
  pinput: ^6.0.2
  lottie: ^3.3.2
  dartz: ^0.10.1
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.1
  permission_handler: ^12.0.2
  hooks_riverpod: ^2.6.1
  flutter_bloc: ^9.1.1
  font_awesome_flutter: ^11.0.0
  google_fonts: ^8.1.0
  lucide_icons_flutter: ^3.1.19
  collection: ^1.19.1
  get_it: ^8.0.0
  injectable: ^2.5.0
  equatable: ^2.0.5
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^2.6.2
  build_runner: ^2.4.8
  bloc_test: ^10.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/lottie/
    - assets/images/
    
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700  